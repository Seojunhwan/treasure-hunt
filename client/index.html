<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>송년 보물찾기</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="stylesheet" href="/fonts/jua/jua.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="보물찾기" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root {
      --ink: #2b1d14; --paper: #fbf3e2; --paper-edge: #e6d6b8; --red: #b8283c; --red-dark: #7e1526;
      --pine: #1f3d2f; --gold: #f2c14e; --gold-dark: #b8862a; --night: #0b1220;
      --display: 'Jua', system-ui, sans-serif;
      --top: max(10px, env(safe-area-inset-top)); --left: max(12px, env(safe-area-inset-left)); --right: max(12px, env(safe-area-inset-right));
    }
    /* position: fixed on body stops iOS from leaving the page scrolled after the keyboard closes */
    html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; background: var(--night); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; font-family: var(--display); }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    #status, #fps, #hud, .stick, #score, #toast, #pickup, #mute { z-index: 2; }
    [hidden] { display: none !important; }
    body.lobby #hud, body.lobby #score { display: none; } /* the join card owns the screen until we're in */
    svg { display: block; }

    /* --- top-left: who am I + gift tag score --- */
    #status { position: fixed; top: var(--top); left: var(--left); display: flex; align-items: center; gap: 6px; color: var(--paper); font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #e05a5a; box-shadow: 0 0 6px #e05a5a; }
    #status.ok .dot { background: #6fdc8c; box-shadow: 0 0 6px #6fdc8c; }
    #status .net { opacity: .6; font-size: 11px; }
    #score { position: fixed; top: calc(var(--top) + 26px); left: var(--left); display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 22px; background: var(--paper); color: var(--ink);
      border-radius: 4px 12px 12px 4px; clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); box-shadow: inset 0 -3px 0 var(--paper-edge); }
    #score::before { content: ''; position: absolute; left: 9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--night); } /* tag hole */
    #score svg { width: 22px; height: 22px; }
    #score b { font-weight: 400; font-size: 24px; line-height: 1; min-width: 1ch; }

    /* --- top-center: hanging timer sign --- */
    #hud { position: fixed; top: 0; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
    #hud .plate { position: relative; margin-top: calc(var(--top) + 6px); padding: 4px 18px 2px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 0 3px 0 var(--paper-edge), 0 6px 14px rgba(0,0,0,.35); }
    #hud .plate::before, #hud .plate::after { content: ''; position: absolute; bottom: 100%; width: 2px; height: 40px; background: var(--paper-edge); } /* strings */
    #hud .plate::before { left: 14px; } #hud .plate::after { right: 14px; }
    #timer { font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
    #hud.urgent .plate { background: var(--red); color: var(--paper); border-color: var(--red-dark); box-shadow: 0 3px 0 var(--red-dark), 0 6px 14px rgba(0,0,0,.35); }
    #msg { margin-top: 6px; color: var(--paper); font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    #msg:empty { display: none; }

    /* --- top-right: fps (debug) and the sound ornament --- */
    #fps { pointer-events: auto; position: fixed; top: var(--top); right: calc(var(--right) + 52px); font: 12px system-ui, sans-serif; color: var(--paper); background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; }
    #fps:empty { display: none; }
    #mute { position: fixed; top: var(--top); right: var(--right); width: 42px; height: 42px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
      background: radial-gradient(circle at 35% 30%, #3d6b55, var(--pine) 60%, #10241b); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.4); color: var(--gold); }
    #mute svg { width: 20px; height: 20px; }
    #mute .off { display: none; } #mute.muted .on { display: none; } #mute.muted .off { display: block; }

    /* --- moments: ribbon toast --- */
    #toast { position: fixed; top: 34%; left: 50%; transform: translateX(-50%); padding: 10px 40px; background: var(--red); color: var(--paper); font-size: 22px; white-space: nowrap; pointer-events: none;
      clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 50%, 100% 100%, 0 100%, 14px 50%); box-shadow: inset 0 3px 0 rgba(255,255,255,.15), inset 0 -3px 0 rgba(0,0,0,.2); animation: drop .35s cubic-bezier(.2,1.4,.4,1); }
    #toast.gold { background: var(--gold); color: var(--ink); }
    @keyframes drop { from { transform: translate(-50%, -16px) scale(.9); opacity: 0; } }

    /* --- bottom-right: the pickup bauble --- */
    #pickup { position: fixed; right: max(26px, calc(env(safe-area-inset-right) + 14px)); bottom: max(22px, env(safe-area-inset-bottom)); width: 118px; height: 118px; border: 0; border-radius: 50%; padding: 0; touch-action: none;
      background: radial-gradient(circle at 34% 30%, #ff8a8a 0, #e0384c 22%, var(--red) 55%, var(--red-dark) 100%); color: var(--paper); font: 26px var(--display);
      box-shadow: inset 0 -6px 12px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.45); animation: glow 1.1s ease-in-out infinite; }
    #pickup::before { content: ''; position: absolute; top: -12px; left: 50%; width: 26px; height: 16px; margin-left: -13px; border-radius: 4px; background: linear-gradient(var(--gold), var(--gold-dark)); } /* ornament cap */
    #pickup:active { transform: scale(.93); }
    @keyframes glow { 50% { box-shadow: inset 0 -6px 12px rgba(0,0,0,.3), 0 0 0 8px rgba(242,193,78,.35), 0 6px 16px rgba(0,0,0,.45); } }

    /* --- joystick --- */
    .stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px dashed rgba(251,243,226,.55); background: rgba(251,243,226,.08); pointer-events: none; }
    .knob { position: absolute; left: 31px; top: 31px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--paper) 60%, var(--paper-edge)); box-shadow: 0 3px 8px rgba(0,0,0,.35); }

    #glow { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; box-shadow: inset 0 0 40px 18px rgba(255, 200, 60, .95); transition: opacity .15s; }

    /* --- full-screen cards: join, result, rotate --- */
    .sheet { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: rgba(8,12,28,.62); color: var(--paper); }
    .logo { text-align: center; line-height: 1; }
    .logo small { display: block; color: var(--gold); font-size: 18px; letter-spacing: 6px; margin-bottom: 4px; }
    .logo strong { font-weight: 400; font-size: 46px; color: var(--paper); text-shadow: 0 3px 0 var(--red-dark), 0 6px 18px rgba(0,0,0,.6); }
    .card { position: relative; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    .card::after { content: ''; position: absolute; inset: 6px; border: 2px dashed var(--paper-edge); border-radius: 10px; pointer-events: none; } /* stitching */
    #join .card { display: flex; gap: 10px; align-items: center; }
    #join input { width: 200px; font: 20px var(--display); color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--ink); padding: 6px 2px; outline: none; user-select: text; -webkit-user-select: text; position: relative; z-index: 1; }
    #join input::placeholder { color: #a8957a; }
    #join button { position: relative; z-index: 1; font: 20px var(--display); color: var(--paper); background: var(--red); border: 0; border-radius: 10px; padding: 10px 18px; box-shadow: inset 0 -3px 0 var(--red-dark); }
    #join button:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--red-dark); }
    #join-error { min-height: 1.2em; margin: 0; color: #ffb4b4; font-size: 15px; }
    #install { max-width: 520px; margin: 0 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(242,193,78,.4); background: rgba(242,193,78,.1); font: 14px/1.55 system-ui, sans-serif; text-align: center; }
    #install b { color: var(--gold); font-weight: 600; }
    #install button { margin-top: 8px; font: 16px var(--display); padding: 8px 16px; border: 0; border-radius: 8px; background: var(--gold); color: var(--ink); }

    #result .card { text-align: center; padding: 22px 46px 18px; }
    #result .title { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); padding: 6px 30px; background: var(--red); color: var(--paper); font-size: 20px; white-space: nowrap;
      clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%, 12px 50%); }
    #result .rank { font-size: 64px; line-height: 1; color: var(--red); margin-top: 6px; }
    #result .mine { font-size: 22px; margin-top: 4px; }
    #result .sub { font: 13px system-ui, sans-serif; color: #7c6a52; margin-top: 10px; }

    #rotate { display: none; z-index: 10; background: var(--night); font-size: 20px; }
    #rotate svg { width: 64px; height: 64px; color: var(--gold); animation: turn 2s ease-in-out infinite; }
    @keyframes turn { 40%, 60% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body class="lobby">
  <div id="status" role="status"><i class="dot"></i><span class="name">연결 중…</span><span class="net"></span></div>
  <div id="score" hidden aria-label="찾은 보물">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5" fill="#b8283c"/><rect x="2" y="7" width="20" height="4" rx="1" fill="#d23a4f"/><rect x="10.5" y="7" width="3" height="14" fill="#f2c14e"/><path d="M12 7c-1.5-3-5-3.5-5-1.3S10 7 12 7zm0 0c1.5-3 5-3.5 5-1.3S14 7 12 7z" fill="none" stroke="#f2c14e" stroke-width="1.6"/></svg>
    <b>0</b>
  </div>
  <div id="fps" aria-hidden="true"></div>
  <div id="hud"><div class="plate"><div id="timer">--:--</div></div><div id="msg" role="status"></div></div>
  <button id="mute" type="button" aria-label="소리 끄기">
    <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="glow" aria-hidden="true"></div>
  <div id="toast" role="status" hidden></div>
  <button id="pickup" type="button" hidden>줍기</button>

  <div id="result" class="sheet" role="status" hidden>
    <div class="card"><div class="title">게임 종료</div><div class="rank"></div><div class="mine"></div><div class="sub">큰 화면에서 전체 순위를 확인하세요</div></div>
  </div>

  <form id="join" class="sheet" hidden>
    <div class="logo"><small>2026 송년회</small><strong>보물찾기</strong></div>
    <div class="card">
      <input id="name" maxlength="12" placeholder="닉네임 (1~12자)" autocomplete="off" aria-label="닉네임" required />
      <button type="submit">입장하기</button>
    </div>
    <p id="join-error" role="alert"></p>
    <div id="install" hidden></div>
  </form>

  <div id="rotate" class="sheet" role="alert">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
    휴대폰을 가로로 돌려주세요
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
