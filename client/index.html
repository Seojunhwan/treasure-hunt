<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>보물찾기</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="보물찾기" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    /* position: fixed on body stops iOS from leaving the page scrolled after the keyboard closes */
    html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; background: #0b1220; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    #status, #fps, #hud, .stick, #score, #toast, #pickup, #mute { z-index: 2; }
    #mute { position: fixed; top: max(36px, calc(env(safe-area-inset-top) + 28px)); right: max(8px, env(safe-area-inset-right)); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); font-size: 18px; touch-action: manipulation; }
    #glow { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; box-shadow: inset 0 0 40px 18px rgba(255, 200, 60, .95); transition: opacity .15s; }
    #score { position: fixed; top: max(40px, calc(env(safe-area-inset-top) + 32px)); left: max(8px, env(safe-area-inset-left)); padding: 4px 10px; font: 700 18px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.5); border-radius: 6px; }
    #toast { position: fixed; top: 38%; left: 50%; transform: translateX(-50%); padding: 10px 18px; font: 700 20px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65); border-radius: 12px; pointer-events: none; white-space: nowrap; }
    #pickup { position: fixed; right: max(28px, calc(env(safe-area-inset-right) + 16px)); bottom: max(28px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; border: 4px solid #fff; background: #ffb321; color: #3a2400; font: 800 22px system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.35); touch-action: manipulation; }
    #pickup:active { transform: scale(.94); }
    #result { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(11,18,32,.78); color: #fff; font-family: system-ui, sans-serif; text-align: center; }
    #result .title { font-size: 30px; font-weight: 800; }
    #result .mine { font-size: 40px; font-weight: 800; color: #ffd76a; }
    #result .sub { font-size: 16px; color: #c8d4e0; }
    [hidden] { display: none !important; }
    .stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.6); pointer-events: none; }
    .knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.85); }
    #join { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: rgba(11,18,32,.8); color: #fff; font: 16px system-ui, sans-serif; }
    #join[hidden] { display: none; }
    #join h1 { margin: 0; font-size: 26px; }
    #join input, #join button { font-size: 18px; padding: 10px 14px; border-radius: 8px; border: 0; }
    #join input { width: 220px; user-select: text; -webkit-user-select: text; }
    #join button { background: #4a90d9; color: #fff; font-weight: 700; min-width: 120px; }
    #join-error { min-height: 1.2em; margin: 0; color: #ffb4b4; }
    #install { max-width: 520px; margin: 0 16px; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,.12); font-size: 14px; line-height: 1.5; text-align: center; }
    #install[hidden] { display: none; }
    #install b { color: #ffd76a; }
    #install button { margin-top: 6px; font-size: 15px; padding: 8px 14px; background: #ffd76a; color: #1a1a1a; }
    #hud { position: fixed; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; color: #fff; font-family: system-ui, sans-serif; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    #timer { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #msg { font-size: 15px; font-weight: 600; }
    #msg:empty { display: none; }
    #fps { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); font: 12px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 4px; }
    #fps:empty { display: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #0b1220; color: #fff; font: 600 18px/1.4 system-ui, sans-serif; text-align: center; }
    @media (orientation: portrait) { #rotate { display: flex; } }
    #status { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); padding: 4px 8px; font: 12px/1.4 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.5); border-radius: 4px; }
  </style>
</head>
<body>
  <div id="status" role="status">연결 중…</div>
  <div id="fps" aria-hidden="true"></div>
  <div id="hud"><div id="timer">--:--</div><div id="msg" role="status"></div></div>
  <div id="score" hidden></div>
  <button id="mute" type="button"></button>
  <div id="glow" aria-hidden="true"></div>
  <div id="toast" role="status" hidden></div>
  <button id="pickup" type="button" hidden>✋ 줍기</button>
  <div id="result" role="status" hidden><div class="title">🎉 게임 종료!</div><div class="mine"></div><div class="sub">큰 화면에서 최종 순위를 확인하세요</div></div>
  <form id="join" hidden>
    <h1>❄️ 보물찾기</h1>
    <input id="name" maxlength="12" placeholder="닉네임 (1~12자)" autocomplete="off" aria-label="닉네임" required />
    <button type="submit">입장</button>
    <p id="join-error" role="alert"></p>
    <div id="install" hidden></div>
  </form>
  <div id="rotate" role="alert"><div style="font-size:48px" aria-hidden="true">📱↻</div>휴대폰을 가로로 돌려주세요</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
