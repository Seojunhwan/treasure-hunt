<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>송년 보물찾기 · 큰 화면</title>
  <link rel="stylesheet" href="/fonts/jua/jua.css" />
  <style>
    :root { --ink: #2b1d14; --paper: #fbf3e2; --paper-edge: #e6d6b8; --red: #b8283c; --red-dark: #7e1526; --pine: #1f3d2f; --gold: #f2c14e; --gold-dark: #b8862a; --night: #0b1220; --display: 'Jua', system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; color: var(--paper); font-family: var(--display); overflow: hidden;
      background: radial-gradient(ellipse at 50% 120%, #2a3360 0, #141a38 45%, var(--night) 80%); }
    /* snowfall made of two drifting dot layers */
    body::before, body::after { content: ''; position: fixed; inset: -100px 0 0; pointer-events: none;
      background-image: radial-gradient(2px 2px at 20px 30px, #fff9, transparent), radial-gradient(1.5px 1.5px at 120px 80px, #fff8, transparent), radial-gradient(2.5px 2.5px at 200px 160px, #fff6, transparent), radial-gradient(1.5px 1.5px at 60px 200px, #fffa, transparent);
      background-size: 240px 240px; animation: snow 18s linear infinite; }
    body::after { background-size: 340px 340px; animation-duration: 28s; opacity: .6; }
    @keyframes snow { to { transform: translateY(240px); } }
    [hidden] { display: none !important; }
    main { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1.1fr; gap: 4vw; height: 100%; padding: 4vh 4vw; box-sizing: border-box; }
    .logo small { display: block; color: var(--gold); font-size: 1.6vw; letter-spacing: .6vw; }
    .logo strong { font-weight: 400; font-size: 5.2vw; line-height: 1; text-shadow: 0 .35vw 0 var(--red-dark), 0 1vw 2vw rgba(0,0,0,.5); }
    .sign { position: relative; display: inline-block; margin-top: 6vh; padding: .6vh 2.4vw 0; background: var(--paper); color: var(--ink); border: .3vw solid var(--ink); border-radius: 1.2vw; box-shadow: 0 .5vw 0 var(--paper-edge), 0 1.2vw 3vw rgba(0,0,0,.45); }
    .sign::before, .sign::after { content: ''; position: absolute; bottom: 100%; width: .3vw; height: 6vh; background: var(--paper-edge); }
    .sign::before { left: 2vw; } .sign::after { right: 2vw; }
    .sign.urgent { background: var(--red); color: var(--paper); border-color: var(--red-dark); box-shadow: 0 .5vw 0 var(--red-dark), 0 1.2vw 3vw rgba(0,0,0,.45); }
    #timer { font-size: 9vw; line-height: 1; font-variant-numeric: tabular-nums; }
    .ribbon { display: inline-block; margin-top: 3vh; padding: .8vh 3vw; background: var(--red); font-size: 2vw; clip-path: polygon(0 0, 100% 0, calc(100% - 1.2vw) 50%, 100% 100%, 0 100%, 1.2vw 50%); }
    .ribbon.playing { background: var(--pine); } .ribbon.ended { background: var(--gold); color: var(--ink); }
    .join { margin-top: 3vh; font: 1.4vw/1.5 var(--display); color: #c9d0e6; display: flex; gap: 1.6vw; align-items: center; }
    #qr { flex: none; width: 13vw; height: 13vw; padding: .6vw; background: var(--paper); border-radius: 1vw; box-shadow: 0 .8vw 2vw rgba(0,0,0,.4); }
    #qr svg { width: 100%; height: 100%; }
    .join b { display: block; font: 2.4vw var(--display); color: var(--paper); }
    .controls { display: flex; gap: 1vw; margin-top: 3vh; }
    .mini { font-size: 1.1vw; padding: .5vh 1vw; margin: .6vh .4vw 0 0; background: transparent; color: #c9d0e6; border: .15vw solid rgba(201,208,230,.5); }
    .mini.save { background: var(--gold); color: var(--ink); border-color: var(--gold); }
    #url-input { width: 28vw; font: 1.3vw var(--display); padding: .6vh .8vw; border-radius: .6vw; border: 0; color: var(--ink); background: var(--paper); }
    #url-error { display: block; color: #ffb4b4; font-size: 1.1vw; }
    button { font: 1.7vw var(--display); padding: 1.2vh 2.4vw; border-radius: .8vw; cursor: pointer; }
    #start { background: var(--gold); color: var(--ink); border: 0; box-shadow: inset 0 -.35vw 0 var(--gold-dark); }
    #start:disabled { background: #3a4462; color: #8c95b0; box-shadow: none; cursor: default; }
    .ghost { background: transparent; color: #ffb3bd; border: .2vw solid #ffb3bd; }
    .link { font: 1.7vw var(--display); padding: 1.2vh 2vw; border-radius: .8vw; text-decoration: none; color: var(--paper); border-color: rgba(251,243,226,.5); }
    #qcount { margin: 1.4vh 0 0; font-size: 1.3vw; color: #c9d0e6; }
    #qcount.warn { color: var(--gold); }

    /* ranking board: a paper card with stitched border */
    .board { position: relative; align-self: start; background: var(--paper); color: var(--ink); border-radius: 1.4vw; padding: 3vh 2.4vw 2vh; box-shadow: 0 1.6vw 4vw rgba(0,0,0,.5); max-height: 88vh; box-sizing: border-box; overflow: hidden; }
    .board::after { content: ''; position: absolute; inset: .6vw; border: .2vw dashed var(--paper-edge); border-radius: 1vw; pointer-events: none; }
    .board h2 { margin: 0; font-weight: 400; font-size: 2.6vw; }
    #left { font-size: 1.6vw; color: var(--red); margin: .4vh 0 1.6vh; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { display: flex; gap: 1.2vw; align-items: center; font-size: 2.2vw; padding: .9vh 0; border-bottom: .15vw solid var(--paper-edge); }
    li:last-child { border-bottom: 0; }
    .r { flex: none; width: 3.2vw; height: 3.2vw; display: grid; place-items: center; border-radius: 50%; font-size: 1.6vw; color: var(--ink); background: var(--paper-edge); }
    .r.m1 { background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold) 55%, var(--gold-dark)); }
    .r.m2 { background: radial-gradient(circle at 35% 30%, #fff, #c9ced8 55%, #8e95a3); }
    .r.m3 { background: radial-gradient(circle at 35% 30%, #f6c69a, #c9814a 55%, #8a5226); color: var(--paper); }
    .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s { color: var(--red); font-variant-numeric: tabular-nums; }
    #empty { font: 1.6vw var(--display); color: #8a7760; margin: 2vh 0; }
    #rank.ticket-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.6vw; max-height: 68vh; overflow-y: auto; }
    .ticket-list li { min-width: 0; font-size: clamp(14px, 1.45vw, 26px); padding: .65vh .3vw; }
    .ticket-list .s { flex: none; }
    #error { position: relative; z-index: 1; margin: 20vh auto; max-width: 60vw; text-align: center; font-size: 2vw; color: #ffb4b4; }

    /* final: podium */
    #final { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 5vh 4vw; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 0, #2a3360 0, var(--night) 70%); }
    #final h1 { margin: 0 0 4vh; font-weight: 400; font-size: 5vw; text-shadow: 0 .35vw 0 var(--red-dark); }
    #podium { display: flex; align-items: flex-end; gap: 2vw; }
    .place { position: relative; width: 22vw; text-align: center; background: var(--paper); color: var(--ink); border-radius: 1.4vw; padding: 5vh 1vw 3vh; box-shadow: 0 1.4vw 3vw rgba(0,0,0,.5); }
    .place .r { position: absolute; top: -3vw; left: 50%; transform: translateX(-50%); width: 6vw; height: 6vw; font-size: 3vw; box-shadow: 0 .6vw 1.4vw rgba(0,0,0,.4); }
    .place .n { font-size: 3vw; }
    .place .s { font-size: 2vw; margin-top: .6vh; }
    .place.p1 { padding: 8vh 1vw 5vh; box-shadow: 0 0 0 .4vw var(--gold), 0 1.4vw 3vw rgba(0,0,0,.5); }
    #rest { columns: 3; column-gap: 3vw; margin-top: 5vh; width: 80vw; }
    #rest li { font-size: 1.7vw; break-inside: avoid; color: var(--paper); border-color: rgba(251,243,226,.15); }
    #rest .r { width: 2.4vw; height: 2.4vw; font-size: 1.2vw; background: rgba(251,243,226,.15); color: var(--paper); }
    #rest .s { color: var(--gold); }
    #final .controls { margin-top: auto; }
  </style>
</head>
<body>
  <p id="error" role="alert" hidden></p>
  <main id="app" hidden>
    <section>
      <div class="logo"><small>2026 송년회</small><strong>보물찾기</strong></div>
      <div class="sign" id="sign"><div id="timer" aria-live="off">--:--</div></div><br />
      <div class="ribbon" id="phase" role="status"></div>
      <div class="join"><div id="qr" aria-label="접속 QR 코드"></div><div><span id="count"></span><b id="url"></b>
        <button id="url-edit" type="button" class="mini">주소 수정</button>
        <form id="url-form" hidden>
          <input id="url-input" type="url" placeholder="https://… (비우면 기본 주소)" aria-label="참가자 접속 주소" />
          <button type="submit" class="mini save">저장</button><button id="url-cancel" type="button" class="mini">취소</button>
          <span id="url-error" role="alert"></span>
        </form>
      </div></div>
      <div class="controls">
        <button id="start" type="button">시작</button>
        <button id="reset" type="button" class="ghost">리셋</button>
        <a id="qlink" class="ghost link" href="#">문제 관리</a>
      </div>
      <p id="qcount"></p>
    </section>
    <section class="board">
      <h2 id="board-title">순위</h2>
      <div id="left"></div>
      <ol id="rank"></ol>
      <p id="empty">보물을 찾으면 여기에 이름이 올라가요</p>
    </section>
  </main>
  <section id="final" hidden>
    <h1>최종 순위</h1>
    <div id="podium"></div>
    <ol id="rest"></ol>
    <div class="controls"><button id="reset2" type="button" class="ghost">리셋</button></div>
  </section>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
